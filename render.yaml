services:
  - type: web
    name: nexo-credential-network
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: NEXT_PUBLIC_POLYGON_AMOY_RPC
        value: https://rpc-amoy.polygon.technology
      - key: NEXT_PUBLIC_TRUST_REGISTRY_ADDRESS
        value: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      - key: NEXT_PUBLIC_CREDENTIAL_ANCHOR_ADDRESS
        value: 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - key: NEXT_PUBLIC_REVOCATION_REGISTRY_ADDRESS
        value: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      - key: NEXT_PUBLIC_IPFS_GATEWAY
        value: https://gateway.pinata.cloud/ipfs/
      - key: SESSION_SECRET
        generateValue: true
